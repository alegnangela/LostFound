services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lostfound
      POSTGRES_USER: lostfound
      POSTGRES_PASSWORD: lostfound
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lostfound -d lostfound"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      # Compose is the local-development setup: HTTP Basic users instead of Azure AD
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: lostfound
      DB_USERNAME: lostfound
      DB_PASSWORD: lostfound
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      USER_PASSWORD: ${USER_PASSWORD:?USER_PASSWORD must be set in .env}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
